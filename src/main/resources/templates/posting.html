<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<title class="header">블로그 포스팅</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<link rel="stylesheet" th:href="@{/css/sideMenu.css}">
	<link rel="stylesheet" th:href="@{/css/posting.css}">
	<link rel="stylesheet" th:href="@{/css/customAlert.css}"> </head>
</head>

<body>
	<div th:replace="~{common/sideMenu :: sideMenu}"></div>
	<div class="postings-wrapper">
		<div class="postings-main-content">
		
			<!-- 좌측 출력 Container -->
			<div class="postings-setup-area">
				<div class="setup-content">
					<div class="postings-item">
						<div class="postings-label">Setting에 첨부된 추가 프롬포트 사용 여부</div>
						<div class="postings-control">
							<label><input type="radio" name="useAiTool" value="true" checked> 사용</label>
							<label><input type="radio" name="useAiTool" value="false"> 미사용</label>
						</div>
					</div>
					<br />
					<div class="postings-col-item">
						<div style="display: flex;">
							<label for="searchCategory" class="postings-label"> 🔹 카테고리(최대 5개)</label>
							<p style="margin: 5px; font-size: 10px; color: gray;">구분자는 쉼표(,)로 구분해주세요</p>
						</div>
						<input type="text" class="form-control" id="searchCategory" placeholder="카테고리를 입력하세요">
					</div>
					<br />
					<p style="margin: 5px; font-size: 10px; color: gray;">블로그 크롤링과 뉴스 크롤링 수는 각각 10개를 넘길 수 없습니다.</p>
					<div class="postings-col-item">
						<label class="postings-label">🔹 블로그 크롤링 수</label>
						<div class="number-control">
							<button type="button" onclick="valueHandler(this, -1)">&#10094;</button>
							<input type="number" id="crawlingBlogQty" value="5" min="0" max="10" readonly>
							<button type="button" onclick="valueHandler(this, 1)">&#10095;</button>
						</div>
					</div>
					<br />
					<div class="postings-col-item">
						<label class="postings-label">🔹 뉴스 크롤링 수</label>
						<div class="number-control">
							<button type="button" onclick="valueHandler(this, -1)">&#10094;</button>
							<input type="number" id="crawlingNewsQty" value="5" min="0" max="10" readonly>
							<button type="button" onclick="valueHandler(this, 1)">&#10095;</button>
						</div>
					</div>
					<br />
					<p style="margin: 5px; font-size: 10px; color: gray;">임시작성과 작성수의 개수의 합은 10개를 넘길 수 없으며 각각 최대 값 또한 10개를 넘길 수 없습니다.</p>
					<div class="postings-col-item">
						<label class="postings-label">🔹 블로그 임시 작성 수</label>
						<div class="number-control">
							<button type="button" onclick="valueHandler(this, -1)">&#10094;</button>
							<input type="number" id="tempWriteQty" value="5" min="0" max="10" readonly>
							<button type="button" onclick="valueHandler(this, 1)">&#10095;</button>
						</div>
					</div>
					<br />
					<div class="postings-col-item">
						<label class="postings-label">🔹 블로그 작성 수</label>
						<div class="number-control">
							<button type="button" onclick="valueHandler(this, -1)">&#10094;</button>
							<input type="number" id="realWriteQty" value="5" min="0" max="10" readonly>
							<button type="button" onclick="valueHandler(this, 1)">&#10095;</button>
						</div>
					</div>
				</div>
				
				<!-- footer -->
				<div class="setup-footer">
					<button type="button" onclick="blogPostingStart()" class="btn btn-primary w-100">Ai Tool 실행</button>
				</div>
			</div>
			
			<!-- Log 출력 Container -->
			<div class="postings-log-area">
				<div class="log-header">📜 실행 로그</div>
				<div id="logConsole" class="log-box">
					> Ai Tool 시스템이 준비되었습니다. <br/>
					> Ai Tool Button을 클릭하여 포스팅을 시작해보세요
				</div>
			</div>
	
		</div>
	</div>
	 
	
	
	<div th:replace="~{common/customAlert :: customAlert}"></div>
	<div th:replace="~{common/customConfirm  :: customConfirm}"></div>
	
	<script th:src="@{/js/main.js}"></script>
	<script th:src="@{/js/posting.js}"></script>
	<script th:src="@{/js/licenseVerify.js}"></script>
	<script th:src="@{/js/customAlert.js}"></script>
	<script th:src="@{/js/customConfirm.js}"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
		crossorigin="anonymous"></script>
</body>

</html>
