<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<title class="header">블로그 포스팅</title>
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<link rel="stylesheet" th:href="@{/css/sideMenu.css}">
	<link rel="stylesheet" th:href="@{/css/posting.css}">
	<link rel="stylesheet" th:href="@{/css/customAlert.css}"> </head>
</head>

<body>
	<div th:replace="~{common/sideMenu :: sideMenu}"></div>
	<div class="postings-wrapper">
		<!-- 첨부된 명령프롬포트를 사용할지 여부-->
		<div class="postings-item">
			<div class="postings-label">Setting에 첨부된 추가 프롬포트 사용 여부</div>
			<div class="postings-control">
				<label>
					<input type="radio" name="useAiTool" value="true" checked>
					사용
				</label>
				<label>
					<input type="radio" name="useAiTool" value="false">
					미사용
				</label>
			</div>
		</div>
		<!-- 검색할 카테고리 -->
		<div class="postings-col-item">
			<label for="searchCategory" class="form-label">🔹검색 카테고리</label>
			<input type="text" class="form-control" id="searchCategory" placeholder="카테고리를 입력하세요">
		</div>
	 
	</div>
	 
	<button type="button" class="btn btn-primary">Primary</button>
	
	<div th:replace="~{common/customAlert :: customAlert}"></div>
	
	<script th:src="@{/js/main.js}"></script>
	<script th:src="@{/js/posting.js}"></script>
	<script th:src="@{/js/licenseVerify.js}"></script>
	<script th:src="@{/js/customAlert.js}"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
		crossorigin="anonymous"></script>
</body>

</html>
