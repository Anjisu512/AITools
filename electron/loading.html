<!DOCTYPE html>
<html>

<head>
	<style>
		body {
			background: #2c3e50;
			color: white;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
			font-family: sans-serif;
		}

		.loader {
			border: 5px solid #f3f3f3;
			border-top: 5px solid #3498db;
			border-radius: 50%;
			width: 50px;
			height: 50px;
			animation: spin 2s linear infinite;
			margin-bottom: 20px;
		}

		@keyframes spin {
			0% {
				transform: rotate(0deg);
			}

			100% {
				transform: rotate(360deg);
			}
		}
	</style>
</head>

<body>
	<div class="loader"></div>
	<h2>AITool 시스템 시작 중...</h2>
	<p id="status">서버 인스턴스를 초기화하고 있습니다.</p>
	<p id="status">Create By.AJS</p>
	
</body>

</html>
